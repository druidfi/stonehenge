name: Build and Publish Docker Images

on:
  push:
    branches: [ "5.x" ]
    paths:
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - '.github/workflows/docker.yml'
      - 'make/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and Push images to GHCR
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
          set: |
            REPO_NAME=ghcr.io/${{ github.repository }}
            *.platform=linux/amd64,linux/arm64
          push: true

      - name: Show resulting tags
        run: docker buildx bake -f docker-bake.hcl --print | jq -r '.target."traefik".tags' || true
